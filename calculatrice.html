<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Calculatrice</title>
<style>
body { background: #ffe4f1; font-family: Arial; display: flex; justify-content: center; padding: 20px; margin: 0; }
.calculatrice { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 0 25px pink; width: 100%; max-width: 380px; text-align: center; }
#ecran { width: 95%; height: 70px; font-size: 34px; text-align: right; border: 3px solid pink; border-radius: 15px; margin-bottom: 20px; padding: 10px; }
button { width: 22%; height: 70px; font-size: 24px; margin: 4px; border: none; border-radius: 18px; background: #ffd1e8; cursor: pointer; font-weight: bold; }
button:hover { background: #ff9ecf; color: white; }
.egal { background: #ff4fa3; color: white; width: 95%; height: 65px; }
</style>
</head>
<body>
<div class="calculatrice">
<h2> Ma Calculatrice</h2>
<input type="text" id="ecran" readonly>
<br>
<button onclick="ajouter('7')">7</button>
<button onclick="ajouter('8')">8</button>
<button onclick="ajouter('9')">9</button>
<button onclick="ajouter('/')">÷</button><br>
<button onclick="ajouter('4')">4</button>
<button onclick="ajouter('5')">5</button>
<button onclick="ajouter('6')">6</button>
<button onclick="ajouter('*')">×</button><br>
<button onclick="ajouter('1')">1</button>
<button onclick="ajouter('2')">2</button>
<button onclick="ajouter('3')">3</button>
<button onclick="ajouter('-')">-</button><br>
<button onclick="ajouter('0')">0</button>
<button onclick="ajouter('.')">.</button>
<button onclick="effacer()">C</button>
<button onclick="ajouter('+')">+</button><br>
<button class="egal" onclick="calculer()">=</button>
</div>
<script>
function ajouter(valeur) { document.getElementById('ecran').value += valeur; }
function effacer() { document.getElementById('ecran').value = ''; }
function calculer() {
  try { document.getElementById('ecran').value = eval(document.getElementById('ecran').value); }
  catch { document.getElementById('ecran').value = 'Erreur'; }
}
</script>
</body>
</html>
